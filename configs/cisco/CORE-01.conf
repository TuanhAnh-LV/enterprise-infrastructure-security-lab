! Cisco IOS-style lab reference template
! Interface names and feature syntax vary by virtual image and release.
! Replace placeholders only in a private working copy.

hostname CORE-01
no ip domain-lookup
ip domain name lvta-lab.test
service timestamps log datetime msec localtime show-timezone
spanning-tree mode rapid-pvst

username admin privilege 15 secret password
crypto key generate rsa modulus 2048
ip ssh version 2
line vty 0 4
 transport input ssh
 login local
 exec-timeout 10 0
!
vlan 10
 name MGMT
vlan 20
 name SERVER
vlan 30
 name OFFICE
vlan 40
 name VOICE
vlan 50
 name GUEST
vlan 60
 name IT
vlan 80
 name SOC
vlan 254
 name TRANSIT
vlan 999
 name NATIVE-BLACKHOLE
!
! ----------------------- Inter-core LACP trunk -------------------------------
interface range Ethernet0/2-3
 description LACP-MEMBER-TO-CORE02
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,60,80,254,999
 switchport nonegotiate
 channel-group 10 mode active
 no shutdown
!
interface Port-channel10
 description TO-CORE02
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,60,80,254,999
 switchport nonegotiate
 no shutdown
!
! ---------------------- Core-to-access trunk --------------------------------
interface Ethernet1/1
 description TO-ACCESS01
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,30,40,50,60,999
 switchport nonegotiate
 spanning-tree guard root
 no shutdown
!
interface Ethernet1/0
 description TO_SW_SERVER
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,80
 switchport nonegotiate
 spanning-tree guard root
 no shutdown
!
! ---------------------- Core-to-FGT trunk --------------------------------
interface range e0/0-1
 description TO_FGT_HA_MEMBER_A
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,50,60,80,254,999
 switchport nonegotiate
 no shutdown
!
! ---------------------- Core Layer-3 settings --------------------------------
! Apply on Layer-3 core switches only.
ip routing
!
interface Loopback0
 ip address 10.255.255.2 255.255.255.255
!
interface Vlan10
 description CORE01-MANAGEMENT
 ip address 10.60.10.11 255.255.255.0
 no shutdown
!
interface Vlan30
 description OFFICE-GATEWAY
 ip address 10.60.30.2 255.255.255.0
 standby version 2
 standby 30 ip 10.60.30.1
 standby 30 priority 100
 standby 30 preempt delay minimum 60
 standby 30 track 10 decrement 30
 ip helper-address 10.60.20.10
 no shutdown
!
interface Vlan40
 description VOICE-GATEWAY
 ip address 10.60.40.2 255.255.255.0
 standby version 2
 standby 40 ip 10.60.40.1
 standby 40 priority 110
 standby 40 preempt delay minimum 60
 standby 40 track 10 decrement 30
 ip helper-address 10.60.20.10
 no shutdown
!
interface Vlan254
 description OSPF-TRANSIT
 ip address 10.60.254.2 255.255.255.248
 no shutdown
!
track 10 ip route 0.0.0.0 0.0.0.0 reachability
!
router ospf 10
 router-id 10.255.255.2
 passive-interface default
 no passive-interface Vlan254
 network 10.60.30.0 0.0.0.255 area 0
 network 10.60.40.0 0.0.0.255 area 0
 network 10.60.254.0 0.0.0.7 area 0
 network 10.255.255.2 0.0.0.0 area 0
!
! ---------------------- Centralized logging ----------------------------------
logging on
logging host 10.60.80.10 transport udp port 514
logging trap informational
logging source-interface Vlan10
logging facility local7
logging buffered 16384 informational
login on-success log
login on-failure log
!
end
!

! Validation:
! show vlan brief
! show interfaces trunk
! show etherchannel summary
! show spanning-tree root
! show standby brief
! show ip ospf neighbor
! show ip route
! show logging

