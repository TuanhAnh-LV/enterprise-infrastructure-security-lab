# FortiGate lab reference template
# Review syntax against the installed FortiOS release.
# Never replace placeholders in a public copy.

# -----------------------------------------------------------------------------
# 1. System and Active-Passive HA
# Apply member-specific hostname and priority before joining the pair.
# -----------------------------------------------------------------------------
config system global
    set hostname "FGT-01"
    set cli-audit-log enable
end

config system ha
    set group-name "FGT-HA-LAB"
    set group-id 10
    set mode a-p
    set password password
    set hbdev "port4" 100 "port5" 50
    set session-pickup enable
    set override disable
    set priority 200
end

# Validate with: get system ha status

# -----------------------------------------------------------------------------
# 2. Physical, redundant and VLAN interfaces
# -----------------------------------------------------------------------------
config system interface
    edit "port1"
        set alias "WAN"
        set role wan
        set mode static
        set ip 172.16.1.20 255.255.255.0
        set allowaccess ping http https
    next

    edit "port8"
        set alias "DMZ"
        set role dmz
        set mode static
        set ip 10.60.70.1 255.255.255.0
        set allowaccess ping
    next

    edit "RED-CORE"
        set vdom "root"
        set type redundant
        set member "port2" "port3"
        set role lan
    next

    edit "V10_MGMT"
        set vdom "root"
        set interface "RED-CORE"
        set vlanid 10
        set role lan
        set ip 10.60.10.1 255.255.255.0
        set allowaccess ping https ssh
    next

    edit "V20_SERVER"
        set vdom "root"
        set interface "RED-CORE"
        set vlanid 20
        set role lan
        set ip 10.60.20.1 255.255.255.0
        set allowaccess ping
    next

    edit "V50_GUEST"
        set vdom "root"
        set interface "RED-CORE"
        set vlanid 50
        set role lan
        set ip 10.60.50.1 255.255.255.0
        set allowaccess ping
    next

    edit "V60_IT"
        set vdom "root"
        set interface "RED-CORE"
        set vlanid 60
        set role lan
        set ip 10.60.60.1 255.255.255.0
        set allowaccess ping https ssh
        set dhcp-relay-service enable
        set dhcp-relay-ip "10.60.20.10"
    next

    edit "V80_SOC"
        set vdom "root"
        set interface "RED-CORE"
        set vlanid 80
        set role lan
        set ip 10.60.80.1 255.255.255.0
        set allowaccess ping
    next

    edit "V254_TRANSIT"
        set vdom "root"
        set interface "RED-CORE"
        set vlanid 254
        set role lan
        set ip 10.60.254.1 255.255.255.248
        set allowaccess ping
    next
end

config system ha
        set monitor "port1" "port8" "RED-CORE"
end

# -----------------------------------------------------------------------------
# 3. Address objects
# -----------------------------------------------------------------------------
config firewall address
    edit "NET_MGMT"
        set subnet 10.60.10.0 255.255.255.0
    next
    edit "NET_SERVER"
        set subnet 10.60.20.0 255.255.255.0
    next
    edit "NET_OFFICE"
        set subnet 10.60.30.0 255.255.255.0
    next
    edit "NET_VOICE"
        set subnet 10.60.40.0 255.255.255.0
    next
    edit "NET_GUEST"
        set subnet 10.60.50.0 255.255.255.0
    next
    edit "NET_IT"
        set subnet 10.60.60.0 255.255.255.0
    next
    edit "NET_DMZ"
        set subnet 10.60.70.0 255.255.255.0
    next
    edit "NET_SOC"
        set subnet 10.60.80.0 255.255.255.0
    next
    edit "WAZUH_SERVER"
        set subnet 10.60.80.10 255.255.255.255
    next
end

config firewall addrgrp
    edit "LAN_EGRESS"
        set member "NET_OFFICE" "NET_VOICE" "NET_IT" "NET_MGMT"  "NET_SERVER" "NET_SOC" "NET_DMZ"
        set comment "Corporate networks allowed standard Internet access"
    next

    edit "AG_ADMIN"
        set member set member "NET_MGMT" "NET_SERVER" "NET_SOC" "NET_DMZ"
    next
end

# -----------------------------------------------------------------------------
# 4. Static default route and OSPF
# -----------------------------------------------------------------------------
config router static
    edit 1
        set dst 0.0.0.0 0.0.0.0
        set gateway 172.16.1.1
        set device "port1"
    next
end

config router ospf
    set router-id 10.255.255.1
    set default-information-originate enable
    config area
        edit 0.0.0.0
        next
    end
    config network
        edit 1
            set prefix 10.60.254.0 255.255.255.248
            set area 0.0.0.0
        next
        edit 2
            set prefix 10.60.10.0 255.255.255.0
            set area 0.0.0.0
        next
        edit 3
            set prefix 10.60.20.0 255.255.255.0
            set area 0.0.0.0
        next
        edit 4
            set prefix 10.60.50.0 255.255.255.0
            set area 0.0.0.0
        next
        edit 5
            set prefix 10.60.60.0 255.255.255.0
            set area 0.0.0.0
        next
        edit 6
            set prefix 10.60.70.0 255.255.255.0
            set area 0.0.0.0
        next
        edit 7
            set prefix 10.60.80.0 255.255.255.0
            set area 0.0.0.0
        next
    end
end

# -----------------------------------------------------------------------------
# 5. Nginx DMZ publishing
# -----------------------------------------------------------------------------
config firewall vip
    edit "VIP_NGINX_HTTPS"
        set extintf "port1"
        set extip 172.16.1.21
        set mappedip "10.60.70.10"
        set portforward enable
        set protocol tcp
        set extport 443
        set mappedport 443
    next
end

# -----------------------------------------------------------------------------
# 6. Representative firewall policy order
# Service and profile names must exist in the target FortiGate.
# -----------------------------------------------------------------------------
config firewall service custom
    edit "WAZUH_AGENT"
        set tcp-portrange "1514"
    next

    edit "WAZUH_ENROLL"
        set tcp-portrange "1515"
    next

    edit "WAZUH_API_ENROLL"
        set tcp-portrange "55000"
    next

    edit "WAZUH_SYSLOG"
        set udp-portrange "514"
    next

    edit "SVC_DHCP_RELAY"
        set udp-portrange 67-68
    next

    edit "SVC_AD_DOMAIN"
        set tcp-portrange 53 88 135 389 445 464 636 3268-3269 9389 49152-65535
        set udp-portrange 53 88 123 137-138 389 464
        set comment "AD DNS Kerberos LDAP SMB NTP RPC services"
    next

    edit "SVC_ADMIN"
        set tcp-portrange 22 443 3389 5985-5986
        set udp-portrange 161
    next
end

config firewall service group
    edit "SG_WAZUH"
        set member WAZUH_AGENT WAZUH_ENROLL WAZUH_API_ENROLL WAZUH_SYSLOG
    next

    edit "SG_SHARED_SERVICES"
        set member SVC_DHCP_RELAY SVC_AD_DOMAIN
    next

    edit "SG_WEB_EGRESS"
        set member DNS HTTP HTTPS
    next
end

config firewall policy
    edit 10
        set name "TO_INTERNET"
        set srcintf "Z_INTERNAL" "V50_GUEST" "port8"
        set dstintf "port1"
        set srcaddr "LAN_EGRESS" "NET_GUEST"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "SG_WEB_EGRESS"
        set nat enable
        set logtraffic all
    next

    edit 20
        set name "IT_TO_ADMIN"
        set srcintf "Z_INTERNAL"
        set dstintf "Z_INTERNAL" "port8"
        set srcaddr "NET_IT"
        set dstaddr "AG_ADMIN"
        set action accept
        set schedule "always"
        set service "PING" "SVC_ADMIN"
        set nat disable
        set logtraffic all
    next

    edit 30
        set name "MONITORED_TO_WAZUH"
        set srcintf "Z_INTERNAL" "port8"
        set dstintf "Z_INTERNAL"
        set srcaddr "LAN_EGRESS"
        set dstaddr "NET_SOC"
        set action accept
        set schedule "always"
        set service "SG_WAZUH"
        set nat disable
        set logtraffic all
    next

    edit 40
        set name "INTERNAL_TO_SHARED_SERVICES"
        set srcintf "Z_INTERNAL"
        set dstintf "Z_INTERNAL"
        set srcaddr "LAN_EGRESS"
        set dstaddr "NET_SERVER"
        set action accept
        set schedule "always"
        set service "SG_SHARED_SERVICES"
        set nat disable
        set logtraffic all
    next
end

config system global
    set admintimeout 480
end

execute cfg save

# Recommended validation:
# get system ha status
# get router info ospf neighbor
# get router info routing-table all
# show firewall policy
# show firewall vip
