# FortiGate IKEv2 remote-access VPN reference template
# Validate all syntax and algorithms against the installed FortiOS/FortiClient release.

config user local
    edit "vpn-user"
        set type password
        set passwd "password"
    next
end

config user group
    edit "VPN-USERS"
        set member "vpn-user"
    next
end

config firewall address
    edit "VPN_CLIENT_POOL"
        set type iprange
        set start-ip 10.250.0.10
        set end-ip 10.250.0.50
        set comment "Remote access VPN clients"
    next
    edit "VPN_SPLIT_DESTINATIONS"
        set subnet 10.60.0.0 255.255.0.0
    next
end

config vpn ipsec phase1-interface
    edit "RA-LAB"
        set type dynamic
        set interface "port1"
  
        set ike-version 2
        set peertype any
        set net-device disable
        set mode-cfg enable

        set proposal des-sha256 des-sha512
  
        set dhgrp 14
        set eap enable
        set eap-identity send-request
        set authusrgrp "VPN-USERS"
  
        set assign-ip-from name
        set ipv4-name "VPN-POOL"
        set ipv4-split-include "VPN_SPLIT_DESTINATIONS"
  
        set dns-mode manual
        set ipv4-dns-server1 10.60.20.10

        set nattraversal enable
        set dpd on-idle
        set dpd-retryinterval 20

        set save-password enable
        set wizard-type dialup-forticlient

        set psksecret "password"
    next
end

config vpn ipsec phase2-interface
    edit "RA-LAB"
        set phase1name "RA-LAB"
        set proposal des-sha256 des-sha512
    next
end

config firewall policy
    edit 50
        set name "VPN-USERS-TO-LAB"
        set srcintf "RA-IKEV2"
        set dstintf "RED-CORE" "port8"

        set srcaddr "VPN_CLIENT_POOL"
        set dstaddr "VPN_SPLIT_DESTINATIONS"

        set action accept
        set schedule "always"
        set service "PING" "DNS" "HTTPS" "SSH" "RDP"
  
        set nat disable
        set logtraffic all
    next
end

