# Send FortiGate events to the Wazuh server in the SOC zone.

config log syslogd setting
    set status enable
    set server "10.60.80.10"
    set mode udp
    set port 514
    set facility local7
    set format default
    set source-ip "10.60.80.1"
end

config log syslogd filter
    set severity information
    set forward-traffic enable
    set local-traffic enable
    set anomaly enable
end

config system global
    set cli-audit-log enable
end

# Validate locally:
# show log syslogd setting
# show log syslogd filter
#
# Validate packet arrival on Wazuh:
# sudo tcpdump -ni any host 10.60.80.1 and udp port 514
