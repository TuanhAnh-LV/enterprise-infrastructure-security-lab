# FortiGate lab reference template
# Review syntax against the installed FortiOS release.
# Never replace placeholders in a public copy.

# -----------------------------------------------------------------------------
# 1. System and Active-Passive HA
# Apply member-specific hostname and priority before joining the pair.
# -----------------------------------------------------------------------------
config system global
    set hostname "<FGT_HOSTNAME>"
    set cli-audit-log enable
end

config system ha
    set group-name "FGT-HA-LAB"
    set group-id 10
    set mode a-p
    set password "<STRONG_HA_PASSWORD>"
    set hbdev "port4" 100 "port5" 50
    set session-pickup enable
    set override disable
    set priority <HA_PRIORITY>
end

# Validate with: get system ha status

# -----------------------------------------------------------------------------
# 2. Physical, redundant and VLAN interfaces
# -----------------------------------------------------------------------------
config system interface
    edit "port1"
        set alias "WAN"
        set role wan
        set mode static
        set ip <WAN_IP> <WAN_MASK>
        set allowaccess ping
    next

    edit "port8"
        set alias "DMZ"
        set role dmz
        set mode static
        set ip 10.60.70.1 255.255.255.0
        set allowaccess ping
    next

    edit "RED-CORE"
        set type redundant
        set member "port2" "port3"
        set role lan
    next

    edit "V10_MGMT"
        set interface "RED-CORE"
        set vlanid 10
        set role lan
        set ip 10.60.10.1 255.255.255.0
        set allowaccess ping https ssh
    next

    edit "V20_SERVER"
        set interface "RED-CORE"
        set vlanid 20
        set role lan
        set ip 10.60.20.1 255.255.255.0
        set allowaccess ping
    next

    edit "V50_GUEST"
        set interface "RED-CORE"
        set vlanid 50
        set role lan
        set ip 10.60.50.1 255.255.255.0
        set allowaccess ping
    next

    edit "V60_IT"
        set interface "RED-CORE"
        set vlanid 60
        set role lan
        set ip 10.60.60.1 255.255.255.0
        set allowaccess ping https ssh
    next

    edit "V80_SOC"
        set interface "RED-CORE"
        set vlanid 80
        set role lan
        set ip 10.60.80.1 255.255.255.0
        set allowaccess ping
    next

    edit "V254_TRANSIT"
        set interface "RED-CORE"
        set vlanid 254
        set role lan
        set ip 10.60.254.1 255.255.255.248
        set allowaccess ping
    next
end

# -----------------------------------------------------------------------------
# 3. Address objects
# -----------------------------------------------------------------------------
config firewall address
    edit "NET_MGMT"
        set subnet 10.60.10.0 255.255.255.0
    next
    edit "NET_SERVER"
        set subnet 10.60.20.0 255.255.255.0
    next
    edit "NET_OFFICE"
        set subnet 10.60.30.0 255.255.255.0
    next
    edit "NET_VOICE"
        set subnet 10.60.40.0 255.255.255.0
    next
    edit "NET_GUEST"
        set subnet 10.60.50.0 255.255.255.0
    next
    edit "NET_IT"
        set subnet 10.60.60.0 255.255.255.0
    next
    edit "NET_DMZ"
        set subnet 10.60.70.0 255.255.255.0
    next
    edit "NET_SOC"
        set subnet 10.60.80.0 255.255.255.0
    next
    edit "RFC1918_10"
        set subnet 10.0.0.0 255.0.0.0
    next
    edit "RFC1918_172"
        set subnet 172.16.0.0 255.240.0.0
    next
    edit "RFC1918_192"
        set subnet 192.168.0.0 255.255.0.0
    next
    edit "WAZUH_SERVER"
        set subnet 10.60.80.10 255.255.255.255
    next
    edit "NGINX_DMZ"
        set subnet 10.60.70.10 255.255.255.255
    next
end

config firewall addrgrp
    edit "INTERNAL_RFC1918"
        set member "RFC1918_10" "RFC1918_172" "RFC1918_192"
    next
end

# -----------------------------------------------------------------------------
# 4. Static default route and OSPF
# -----------------------------------------------------------------------------
config router static
    edit 1
        set dst 0.0.0.0 0.0.0.0
        set gateway <WAN_GATEWAY>
        set device "port1"
    next
end

config router ospf
    set router-id 10.255.255.1
    set default-information-originate enable
    config area
        edit 0.0.0.0
        next
    end
    config network
        edit 1
            set prefix 10.60.254.0 255.255.255.248
            set area 0.0.0.0
        next
    end
end

# -----------------------------------------------------------------------------
# 5. Nginx DMZ publishing
# Replace <PUBLIC_IP> only in a private working copy.
# -----------------------------------------------------------------------------
config firewall vip
    edit "VIP_NGINX_HTTPS"
        set extintf "port1"
        set extip <PUBLIC_IP>
        set mappedip "10.60.70.10"
        set portforward enable
        set protocol tcp
        set extport 443
        set mappedport 443
    next
end

# -----------------------------------------------------------------------------
# 6. Representative firewall policy order
# Service and profile names must exist in the target FortiGate.
# -----------------------------------------------------------------------------
config firewall policy
    edit 0
        set name "IT-TO-INFRA-ADMIN"
        set srcintf "V60_IT"
        set dstintf "V10_MGMT" "V20_SERVER" "V80_SOC"
        set action accept
        set srcaddr "NET_IT"
        set dstaddr "NET_MGMT" "NET_SERVER" "NET_SOC"
        set schedule "always"
        set service "PING" "SSH" "HTTPS" "RDP"
        set logtraffic all
    next

    edit 0
        set name "ENDPOINTS-TO-WAZUH"
        set srcintf "V20_SERVER" "V60_IT"
        set dstintf "V80_SOC"
        set action accept
        set srcaddr "NET_SERVER" "NET_IT"
        set dstaddr "WAZUH_SERVER"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next

    edit 0
        set name "GUEST-DENY-INTERNAL"
        set srcintf "V50_GUEST"
        set dstintf "RED-CORE" "port8"
        set action deny
        set srcaddr "NET_GUEST"
        set dstaddr "INTERNAL_RFC1918"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next

    edit 0
        set name "GUEST-TO-INTERNET"
        set srcintf "V50_GUEST"
        set dstintf "port1"
        set action accept
        set srcaddr "NET_GUEST"
        set dstaddr "all"
        set schedule "always"
        set service "DNS" "HTTP" "HTTPS"
        set nat enable
        set utm-status enable
        set ssl-ssh-profile "certificate-inspection"
        set webfilter-profile "<WEB_FILTER_PROFILE>"
        set dnsfilter-profile "<DNS_FILTER_PROFILE>"
        set av-profile "<ANTIVIRUS_PROFILE>"
        set application-list "<APPLICATION_PROFILE>"
        set logtraffic all
    next

    edit 0
        set name "WAN-TO-NGINX-HTTPS"
        set srcintf "port1"
        set dstintf "port8"
        set action accept
        set srcaddr "all"
        set dstaddr "VIP_NGINX_HTTPS"
        set schedule "always"
        set service "HTTPS"
        set utm-status enable
        set ips-sensor "<SERVER_IPS_PROFILE>"
        set ssl-ssh-profile "certificate-inspection"
        set logtraffic all
    next
end

