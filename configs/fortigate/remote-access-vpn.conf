# FortiGate IKEv2 remote-access VPN reference template
# Validate all syntax and algorithms against the installed FortiOS/FortiClient release.

config user local
    edit "vpn-lab-user"
        set type password
        set passwd "<STRONG_VPN_USER_PASSWORD>"
    next
end

config user group
    edit "VPN-LAB-USERS"
        set member "vpn-lab-user"
    next
end

config firewall address
    edit "VPN_CLIENT_POOL"
        set type iprange
        set start-ip 10.250.0.10
        set end-ip 10.250.0.50
    next
    edit "VPN_SPLIT_DESTINATIONS"
        set subnet 10.60.0.0 255.255.0.0
    next
end

config vpn ipsec phase1-interface
    edit "RA-IKEV2"
        set type dynamic
        set interface "port1"
        set ike-version 2
        set peertype any
        set net-device disable
        set mode-cfg enable
        set proposal aes256-sha256
        set dhgrp 14
        set eap enable
        set eap-identity send-request
        set authusrgrp "VPN-LAB-USERS"
        set ipv4-start-ip 10.250.0.10
        set ipv4-end-ip 10.250.0.50
        set ipv4-netmask 255.255.255.0
        set ipv4-split-include "VPN_SPLIT_DESTINATIONS"
        set psksecret "<STRONG_PSK>"
    next
end

config vpn ipsec phase2-interface
    edit "RA-IKEV2-P2"
        set phase1name "RA-IKEV2"
        set proposal aes256-sha256
        set pfs enable
        set dhgrp 14
        set src-subnet 0.0.0.0 0.0.0.0
        set dst-subnet 0.0.0.0 0.0.0.0
    next
end

config firewall policy
    edit 0
        set name "VPN-USERS-TO-LAB"
        set srcintf "RA-IKEV2"
        set dstintf "RED-CORE" "port8"
        set action accept
        set srcaddr "VPN_CLIENT_POOL"
        set dstaddr "VPN_SPLIT_DESTINATIONS"
        set schedule "always"
        set service "PING" "DNS" "HTTPS" "SSH" "RDP"
        set groups "VPN-LAB-USERS"
        set logtraffic all
    next
end

# Validation checklist:
# - Confirm IKEv2 and user authentication succeed.
# - Confirm the client receives an address from VPN_CLIENT_POOL.
# - Confirm only approved lab destinations enter the tunnel.
# - Confirm Internet traffic remains outside the tunnel when split tunneling is intended.
# - Confirm authentication and traffic logs reach Wazuh.

