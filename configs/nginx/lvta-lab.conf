# Nginx DMZ reference virtual host.
# Use a certificate issued for the lab host and keep all key material outside Git.

server {
    listen 80;
    listen [::]:80;
    server_name web.lvta-lab.test;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name web.lvta-lab.test;

    root /var/www/lvta-lab;
    index index.html;

    ssl_certificate /etc/nginx/certs/web.lvta-lab.test.crt;
    ssl_certificate_key /etc/nginx/certs/web.lvta-lab.test.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    access_log /var/log/nginx/lvta-lab-access.log combined;
    error_log /var/log/nginx/lvta-lab-error.log warn;

    location / {
        try_files $uri $uri/ =404;
        limit_except GET HEAD {
            deny all;
        }
    }

    location ~ /\. {
        deny all;
    }
}

