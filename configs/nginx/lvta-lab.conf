sudo chown -R www-data:www-data /var/www/lvta-lab
sudo chmod -R 755 /var/www/lvta-lab

sudo mkdir -p /etc/nginx/tls

sudo openssl req \
-x509 \
-nodes \
-days 365 \
-newkey rsa:2048 \
-keyout /etc/nginx/tls/lvta-lab.key \
-out /etc/nginx/tls/lvta-lab.crt \
-subj "/C=VN/O=LVTA-LAB/CN=www.lvta-lab.test" \
-addext "subjectAltName=DNS:www.lvta-lab.test,DNS:lvta-lab.test"

sudo nano /etc/nginx/sites-available/lvta-lab
!
server {
    listen 80;
    listen [::]:80;
    server_name lvta-lab.test www.lvta-lab.test;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lvta-lab.test www.lvta-lab.test;

    root /var/www/lvta-lab;
    index index.html;

    ssl_certificate     /etc/nginx/tls/lvta-lab.crt;
    ssl_certificate_key /etc/nginx/tls/lvta-lab.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    access_log /var/log/nginx/lvta-lab-access.log combined;
    error_log /var/log/nginx/lvta-lab-error.log warn;

    location / {
        try_files $uri $uri/ =404;
        limit_except GET HEAD {
            deny all;
        }
    }

    location ~ /\. {
        deny all;
    }
}
!

sudo ln -s /etc/nginx/sites-available/lvta-lab \
/etc/nginx/sites-enabled/lvta-lab

sudo rm -f /etc/nginx/sites-enabled/default

sudo nginx -t
sudo systemctl reload nginx
curl -k https://127.0.0.1/health
